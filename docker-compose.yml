name: unicare-app

services:
  # -------------------------------------------------------------
  # 1. Backend Spring Boot (Chạy chế độ dev, kết nối MySQL Online/Cloud)
  # -------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: unicare-backend
    restart: unless-stopped
    ports:
      - "${SERVER_PORT:-8080}:8080"
    env_file:
      - .env
    volumes:
      - ./backend:/app
      - ~/.m2:/root/.m2 # Lưu cache thư viện Maven giữa các lần rebuild

  # -------------------------------------------------------------
  # 2. Frontend Web App (Dành cho sau này khi bên Frontend sẵn sàng)
