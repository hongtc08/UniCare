server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: unicare-backend

  config:
    # Tự động nạp biến môi trường từ file .env (dù chạy từ thư mục gốc hay thư mục backend)
    import: optional:file:.env[.properties],optional:file:../.env[.properties]

  datasource:
    # Kết nối trực tiếp tới PostgreSQL Online / Cloud (Neon, Supabase, Aiven, Railway...)
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:unicare_db}?sslmode=${DB_SSLMODE:prefer}
    username: ${DB_USER:postgres}
    password: ${DB_PASS:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

app:
  jwt:
    secret: ${JWT_SECRET:unicareSecretKeyForStudentHealthManagementSystem2026UniCareGroup2VerySecureKeyMustBe256Bits}
    expiration: ${JWT_EXPIRATION:86400000} # 24 giờ (ms)
