server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: unicare-backend

  datasource:
    # Kết nối tới MySQL Online / Cloud (hỗ trợ Aiven, Clever Cloud, Railway, AWS RDS...)
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:unicare_db}?sslMode=PREFERRED&serverTimezone=Asia/Ho_Chi_Minh&characterEncoding=UTF-8
    username: ${DB_USER:}
    password: ${DB_PASS:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

app:
  jwt:
    secret: ${JWT_SECRET:unicareSecretKeyForStudentHealthManagementSystem2026UniCareGroup2}
    expiration: ${JWT_EXPIRATION:86400000} # 24 giờ
