name: SonarCloud Code Analysis

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch: # Cho phép nhấn nút chạy thủ công trên GitHub Actions

jobs:
  sonarcloud:
    name: Quét mã nguồn với SonarCloud
    runs-on: ubuntu-latest

    steps:
      # 1. Tải toàn bộ lịch sử Git (bắt buộc depth = 0 để SonarCloud đọc git blame)
      - name: Checkout mã nguồn
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Cài đặt môi trường Java 25
      - name: Thiết lập JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: 25
          distribution: 'temurin'

      # 3. Lưu cache Maven để tăng tốc độ chạy pipeline
      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      # 4. Lưu cache SonarCloud
      - name: Cache SonarCloud packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      # 5. Biên dịch, chạy kiểm thử và đẩy báo cáo lên SonarCloud
      - name: Phân tích Backend với SonarCloud
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # Tự động cấp bởi GitHub
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}   # Lấy từ GitHub Secrets
        run: |
          cd backend
          chmod +x mvnw
          ./mvnw -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.projectKey=hongtc08_UniCare \
            -Dsonar.organization=hongtc08
