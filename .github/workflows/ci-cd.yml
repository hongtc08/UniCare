name: CI/CD Pipeline & Quality Check

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

jobs:
  # =========================================================================
  # 1. KIỂM TRA & QUÉT CHẤT LƯỢNG BACKEND (SPRING BOOT + SONARCLOUD)
  # =========================================================================
  backend-ci:
    name: Backend Build, Test & SonarCloud
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Bắt buộc để SonarCloud đọc lịch sử git và phân tích blame

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build, Test & Analyze with SonarCloud
        working-directory: ./backend
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          chmod +x mvnw
          ./mvnw clean verify org.sonarsource.scanner.maven:sonar-maven-plugin:5.8.0.7211:sonar \
            -Dsonar.projectKey=hongtc08_UniCare \
            -Dsonar.organization=hongtc08

  # =========================================================================
  # 2. KIỂM TRA FRONTEND (REACT + VITE + LINT + TESTS + BUILD)
  # =========================================================================
  frontend-ci:
    name: Frontend Lint, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run ESLint
        working-directory: ./frontend
        run: npm run lint

      - name: Run Unit / Contract Tests
        working-directory: ./frontend
        run: npm test

      - name: Check Production Build
        working-directory: ./frontend
        run: npm run build
