name: CI/CD Pipeline & SonarCloud

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch: # Cho phép nhấn nút chạy thủ công trên GitHub Actions

jobs:
  # 1. Quét lỗi Backend bằng SonarCloud
  sonar-backend:
    name: Quét lỗi Backend (SonarCloud)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Bắt buộc để SonarCloud đọc lịch sử thay đổi

      - name: Thiết lập JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: 25
          distribution: 'temurin'

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Cache SonarCloud packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Analyze Backend with SonarCloud
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # Tự động cấp bởi GitHub
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}   # Lấy từ GitHub Secrets
        run: |
          cd backend
          chmod +x mvnw
          ./mvnw -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.projectKey=hongtc08_UniCare \
            -Dsonar.organization=hongtc08

